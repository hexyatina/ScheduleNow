[project]
name = "fastapiproject"
version = "0.1.0"
description = "FastApi based project for corporate schedules"
authors = [
    { name = "hexyatina" }
]
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "icalendar>=7.3.0",
    "jinja2>=3.1.6",
    "peewee>=4.5.3",
    "psycopg2-binary>=2.9.9",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
fastapiproject = "fastapiproject:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
